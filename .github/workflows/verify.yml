name: Verify

# This workflow is the mechanical guardrail against the failure mode this repo
# actually experienced: PRs that reported completion while nothing ran. If it
# does not build, test, and lint, it cannot merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Mechanical Invariants (Task R11.14)
        run: node scripts/verify-invariants.mjs

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: CI=true npm run test

      - name: Lint
        run: npm run lint

      - name: Guard against fabricated-data stubs
        run: |
          echo "Checking that stub helpers are not silently re-introduced."
          if grep -rn --exclude-dir="__tests__" --exclude="*.test.*" "Math.sin(i \* 0.1)" src/ ; then
            echo "::error::Fabricated motion trajectory detected (see docs/GAP_ANALYSIS.md #3)."
            exit 1
          fi
          echo "Checking that runtime mode defaults to 'live' (Safe-by-Default invariant §5.5)."
          if grep -rn --exclude-dir="__tests__" --exclude="*.test.*" "currentRuntimeMode: RuntimeMode = 'demo'" src/ ; then
            echo "::error::currentRuntimeMode must default to 'live', not 'demo'."
            exit 1
          fi
          echo "Mechanical stub and runtime mode guards passed."

  verify-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Ensure dist exists for tauri macro
        run: mkdir -p ../dist

      - name: Cargo check
        run: cargo check
