[package]
name = "cinecraft-ai-desktop"
version = "1.0.0"
description = "CineCraft AI - Professional Tier-1 AI Native Video Editor"
authors = ["CineCraft Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.11.0"
hex = "0.4.3"
tauri-plugin-dialog = "2.7.3"
rfd = "0.17.2"
[dev-dependencies]
tempfile = "3.8"
