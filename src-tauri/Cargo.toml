[package]
name = "cinecraft-ai-desktop"
version = "1.0.0"
description = "CineCraft AI - Professional Tier-1 AI Native Video Editor"
authors = ["CineCraft Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = ["protocol-asset"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.11.0"
hex = "0.4.3"
whisper-rs = "0.16.0"
hound = "3.5.1"
ort = "2.0.0-rc.13"
ndarray = "0.17.2"
regex = "1.13.1"
lazy_static = "1.5.0"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
[dev-dependencies]
tempfile = "3.8"
